<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="assets/stylesheets/media-preview.css">
</head>
<body>
    <h2>Test Media Preview</h2>
    <input type="file" id="test-file" multiple accept="image/*,video/*,.pdf">
    
    <script>
        document.getElementById('test-file').addEventListener('change', function(e) {
            console.log('Files selected:', e.target.files.length);
            
            let container = document.querySelector('.media-preview-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'media-preview-container';
                document.body.appendChild(container);
            }
            container.innerHTML = '';
            
            Array.from(e.target.files).forEach(file => {
                console.log('File:', file.name, file.type);
                
                const item = document.createElement('div');
                item.className = 'media-preview-item';
                
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    item.appendChild(img);
                }
                
                container.appendChild(item);
            });
        });
    </script>
</body>
</html>
